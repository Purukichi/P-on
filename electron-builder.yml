# appId は改名しても据え置く。
# これが変わると Windows は別のアプリとして扱い、入っている HAMON が
# 置き換わらずに 2 つ並んでしまう（自動更新も届かない）。
appId: com.hamon.player
productName: P-on
copyright: Copyright © 2026

# 自動更新の配信元。
# ここの owner / repo がそのまま app-update.yml に焼き込まれ、
# インストール済みのアプリはこの Releases を見に行く。
# GitHub のユーザー名やリポジトリ名が違う場合は、必ずここを直してからビルドすること
# （間違っていても起動はするが、更新が永久に見つからない）。
# 1.2.4 から配信元は P-on。
# ただし 1.2.3 以前は旧 HAMON リポジトリを見に来るので、
# 乗り換えの 1 回だけは両方のリリースに同じものを上げること
# （そうしないと、古い版の利用者に更新が届かないまま取り残される）。
publish:
  provider: github
  owner: Purukichi
  repo: P-on
  # 下書きや先行公開は配らない。正式公開したものだけを更新として扱う。
  # Windows 版は 1.3 系の安定版として出す（β2.0.0 はスマホ版だけ）
  releaseType: release

directories:
  buildResources: build
  output: release

# タスクバー用に、アイコンの実体もアプリと一緒に配る。
# exe に埋め込んだアイコンだけだと、エクスプローラーのキャッシュに古い絵が残ることがある。
# windows.js がここに置いたファイルを BrowserWindow へ直接渡す。
extraResources:
  - from: generated/content
    to: content
  - from: build/icon.ico
    to: icon.ico
  - from: build/icon.png
    to: icon.png

# out/ (electron-vite の成果物) と package.json だけがパッケージに入ればよい
files:
  - 'out/**/*'
  - 'package.json'
  - '!**/.vscode/*'
  - '!src/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.editorconfig,.gitignore,README.md,CHANGELOG.md}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml,yarn.lock}'
  - '!{android,ios,server,catalog,tests,scripts,docs}/**/*'
  - '!generated/**/*'

mac:
  icon: build/icon.png
  category: public.app-category.music
  hardenedRuntime: true
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  target:
    - target: dmg
      arch: [arm64, x64]
    - target: zip
      arch: [arm64, x64]
  artifactName: ${productName}-${version}-mac-${arch}.${ext}
  # 「このアプリケーションで開く」に出す。ファイルのアイコンは Finder の標準のまま
  fileAssociations:
    - ext: [mp3, wav, flac, m4a, aac, ogg, opus, webm]
      name: Audio
      role: Viewer

win:
  # build/source/app-icon.jpg から build/make-icon.cjs が作ったもの
  icon: build/icon.ico
  # 電子署名。exe とインストーラの両方に付き、配布後に中身が
  # すり替えられていないことを利用者が確かめられるようにする。
  # 鍵は Windows の証明書ストア（現在のユーザー / 個人）にある
  # 「CN=Yushi Hiyama」を名前で引く。pfx とパスワードをリポジトリに
  # 置かずに済むので、鍵が漏れる経路をひとつ減らせる。
  # 証明書が無い環境では electron-builder が署名で止まるため、
  # ビルドする端末には同じ証明書を入れておくこと。
  #
  # 自動更新のとき、落としてきたインストーラの署名を検証するか。
  # 有効にすると証明書の名義が app-update.yml に焼き込まれ、
  # electron-updater が Get-AuthenticodeSignature で「有効な署名か」を確かめる。
  # ところがこの証明書は自己署名なので、他人の PC では
  # 「信頼されたルートに繋がらない」= 無効と判定され、更新が全部弾かれてしまう。
  # 落としたものが本物かは latest.yml の sha512（HTTPS 経由）で照合しているので、
  # ここは切っておく。公的な認証局の証明書に替えたら true に戻すこと
  verifyUpdateCodeSignature: false
  signtoolOptions:
    certificateSubjectName: Yushi Hiyama
    # 既定は sha1 との二重署名だが、この証明書は sha256 で作ってある。
    # 古い Windows 向けの sha1 は今どこでも不要なので付けない
    signingHashAlgorithms:
      - sha256
    # 署名した時刻を第三者に記録してもらう。
    # これが無いと、証明書の期限が切れた日に署名まで無効になる
    rfc3161TimeStampServer: http://timestamp.digicert.com
  # 配るのはインストーラだけ。ポータブル版は自動更新が効かず、
  # 「更新されない版」が出回るほうが困るのでやめた
  target:
    - target: nsis
      arch:
        - x64
  artifactName: ${productName}-${version}-${arch}.${ext}
  # 音声ファイルとの関連付け。インストーラがレジストリに登録し、
  # エクスプローラーの「プログラムから開く」の一覧に P-on が出るようになる。
  # 開かれたファイルのパスは起動引数で届く（src/main/opened-files.js）。
  #
  # Windows 10 以降は、アプリ側から勝手に「既定のアプリ」にはできない
  # （利用者が一覧で選んで「常に使う」を押したときだけ既定になる）。
  #
  # アイコンは build/make-file-icons.cjs が作った、拡張子入りのシンプルな紙の絵。
  # 拡張子は src/shared/ipc-channels.js の AUDIO_EXTENSIONS と揃えること。
  fileAssociations:
    - ext: mp3
      name: MP3 Audio
      description: MP3 オーディオ
      icon: build/file-icons/mp3.ico
    - ext: wav
      name: WAV Audio
      description: WAV オーディオ
      icon: build/file-icons/wav.ico
    - ext: flac
      name: FLAC Audio
      description: FLAC オーディオ
      icon: build/file-icons/flac.ico
    - ext: m4a
      name: M4A Audio
      description: M4A オーディオ
      icon: build/file-icons/m4a.ico
    - ext: aac
      name: AAC Audio
      description: AAC オーディオ
      icon: build/file-icons/aac.ico
    - ext: ogg
      name: OGG Audio
      description: OGG オーディオ
      icon: build/file-icons/ogg.ico
    - ext: opus
      name: Opus Audio
      description: Opus オーディオ
      icon: build/file-icons/opus.ico
    - ext: webm
      name: WebM Audio
      description: WebM オーディオ
      icon: build/file-icons/webm.ico

nsis:
  # 管理者権限を求めず、現在のユーザーにだけ入れる。
  # 「アプリと機能」に載り、スタートメニューとデスクトップからも起動できる。
  #
  # インストーラの画面は NSIS が描くもので、アプリのような曇りガラスにはできない
  # （Windows の標準ダイアログ部品しか使えない）。
  # 見た目を寄せられない以上、出す情報そのものを削るほうが早いので、
  # ウィザードをやめて「進捗だけの 1 枚」にしてある。
  # 置き場所の選択・ライセンス・完了ページはすべて出ない。
  oneClick: true
  perMachine: false
  allowToChangeInstallationDirectory: false
  # 進捗の窓に出る絵。アプリのアイコンと同じものを使う
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico
  installerHeaderIcon: build/icon.ico
  # 入れ終わったらそのまま起動する（「完了」を押させない）
  runAfterFinish: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  # スタートメニュー直下に置く（フォルダを 1 段挟まない）
  menuCategory: false
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  # 取り込んだ音源は ドキュメント/HAMON にあり、アンインストールでは消さない
  deleteAppDataOnUninstall: false
