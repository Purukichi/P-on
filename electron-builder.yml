# appId は改名しても据え置く。
# これが変わると Windows は別のアプリとして扱い、入っている HAMON が
# 置き換わらずに 2 つ並んでしまう（自動更新も届かない）。
appId: com.hamon.player
productName: P-on
copyright: Copyright © 2026

# 自動更新の配信元。
# ここの owner / repo がそのまま app-update.yml に焼き込まれ、
# インストール済みのアプリはこの Releases を見に行く。
# GitHub のユーザー名やリポジトリ名が違う場合は、必ずここを直してからビルドすること
# （間違っていても起動はするが、更新が永久に見つからない）。
# 1.2.4 から配信元は P-on。
# ただし 1.2.3 以前は旧 HAMON リポジトリを見に来るので、
# 乗り換えの 1 回だけは両方のリリースに同じものを上げること
# （そうしないと、古い版の利用者に更新が届かないまま取り残される）。
publish:
  provider: github
  owner: Purukichi
  repo: P-on
  # 下書きや先行公開は配らない。正式公開したものだけを更新として扱う
  releaseType: release

directories:
  buildResources: build
  output: release

# タスクバー用に、アイコンの実体もアプリと一緒に配る。
# exe に埋め込んだアイコンだけだと、エクスプローラーのキャッシュに古い絵が残ることがある。
# windows.js がここに置いたファイルを BrowserWindow へ直接渡す。
extraResources:
  - from: build/icon.ico
    to: icon.ico

# out/ (electron-vite の成果物) と package.json だけがパッケージに入ればよい
files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.editorconfig,.gitignore,README.md,CHANGELOG.md}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml,yarn.lock}'

win:
  # build/source/app-icon.jpg から build/make-icon.cjs が作ったもの
  icon: build/icon.ico
  # 配るのはインストーラだけ。ポータブル版は自動更新が効かず、
  # 「更新されない版」が出回るほうが困るのでやめた
  target:
    - target: nsis
      arch:
        - x64
  artifactName: ${productName}-${version}-${arch}.${ext}

nsis:
  # 管理者権限を求めず、現在のユーザーにだけ入れる。
  # 「アプリと機能」に載り、スタートメニューとデスクトップからも起動できる。
  #
  # インストーラの画面は NSIS が描くもので、アプリのような曇りガラスにはできない
  # （Windows の標準ダイアログ部品しか使えない）。
  # 見た目を寄せられない以上、出す情報そのものを削るほうが早いので、
  # ウィザードをやめて「進捗だけの 1 枚」にしてある。
  # 置き場所の選択・ライセンス・完了ページはすべて出ない。
  oneClick: true
  perMachine: false
  allowToChangeInstallationDirectory: false
  # 進捗の窓に出る絵。アプリのアイコンと同じものを使う
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico
  installerHeaderIcon: build/icon.ico
  # 入れ終わったらそのまま起動する（「完了」を押させない）
  runAfterFinish: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  # スタートメニュー直下に置く（フォルダを 1 段挟まない）
  menuCategory: false
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  # 取り込んだ音源は ドキュメント/HAMON にあり、アンインストールでは消さない
  deleteAppDataOnUninstall: false
