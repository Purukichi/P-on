appId: com.hamon.player
productName: HAMON
copyright: Copyright © 2026

# 自動更新の配信元。
# ここの owner / repo がそのまま app-update.yml に焼き込まれ、
# インストール済みのアプリはこの Releases を見に行く。
# GitHub のユーザー名やリポジトリ名が違う場合は、必ずここを直してからビルドすること
# （間違っていても起動はするが、更新が永久に見つからない）。
publish:
  provider: github
  owner: Purukichi
  repo: HAMON
  # 下書きや先行公開は配らない。正式公開したものだけを更新として扱う
  releaseType: release

directories:
  buildResources: build
  output: release

# out/ (electron-vite の成果物) と package.json だけがパッケージに入ればよい
files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.editorconfig,.gitignore,README.md,CHANGELOG.md}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml,yarn.lock}'

win:
  # build/icon.svg を元に生成したもの (scripts/make-icon は scratchpad 側)
  icon: build/icon.ico
  # 配るのはインストーラだけ。ポータブル版は自動更新が効かず、
  # 「更新されない版」が出回るほうが困るのでやめた
  target:
    - target: nsis
      arch:
        - x64
  artifactName: ${productName}-${version}-${arch}.${ext}

nsis:
  # 管理者権限を求めず、現在のユーザーにだけ入れる。
  # 「アプリと機能」に載り、スタートメニューとデスクトップからも起動できる。
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  # スタートメニュー直下に置く（フォルダを 1 段挟まない）
  menuCategory: false
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  # 取り込んだ音源は ドキュメント/HAMON にあり、アンインストールでは消さない
  deleteAppDataOnUninstall: false
