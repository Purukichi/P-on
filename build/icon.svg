<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!--
    HAMON のマーク。
    輪の左上を太く、右下を細くした環に、左下へ伸びる尾を付けた形。
    下敷きは置かず、図形そのものをアイコンにする（背景は透過）。

    アプリ内（index.html の .brandmark / .about__mark）と同じ図形なので、
    形を変えるときは両方そろえること。素の viewBox は 0 0 100 110。
  -->
  <g transform="translate(47 26) scale(4.1818)">
    <path
      fill="#00c853"
      fill-rule="evenodd"
      d="M0.4 49.8 L0.4 96 C0.4 104 2.5 110 9 110 C18 110 28 104.5 35.5 97.4 A49.8 49.8 0 1 0 0.4 49.8 Z M24.6 57 A34.1 34.1 0 1 1 92.8 57 A34.1 34.1 0 1 1 24.6 57 Z"
    />
  </g>
</svg>
