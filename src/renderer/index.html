<!doctype html>
<html lang="ja" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: hamon-media:; media-src 'self' hamon-media: blob:; font-src 'self'; connect-src 'self' ws:"
    />
    <title>P-on</title>
  </head>
  <body>
    <!--
      JS が参照するのは data-el 属性だけ。
      class は見た目のためだけに使っているので、自由に付け替えて構わない。
    -->
    <div class="app" id="app" data-state="idle" data-list="hidden">
      <header class="topbar">
        <!--
          ブランドマーク。押すとバージョンと更新の確認が出る。
          図形は build/icon.svg と同じもの（viewBox も揃えてある）。
          色は currentColor 任せなので、設定の色相スライダーに追従する。
        -->
        <button
          class="brandmark"
          type="button"
          data-el="about-open"
          data-tip="バージョン情報"
          aria-label="バージョン情報"
          aria-expanded="false"
        >
          <svg class="brandmark__icon" viewBox="0 0 100 108.67" aria-hidden="true">
            <path
              fill="currentColor"
              fill-rule="evenodd"
              d="M0 50 L0 105.6 C0 107.5 1.3 108.7 3.1 108.7 C3.9 108.7 4.6 108.4 5.2 108 C7.5 103.5 14 98.5 25.5 93.6 A50 50 0 1 0 0 50 Z M23.5 58 A34.3 34.3 0 1 1 92.1 58 A34.3 34.3 0 1 1 23.5 58 Z"
            />
          </svg>
        </button>

        <!--
          音量は上部バーの左端に置く。
          中央カラムに置くと、数値がリストの上に乗ってしまうため。
        -->
        <div class="volume volume--inline">
          <svg class="volume__icon" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
            <path d="M4 9.5h3.5L12 5.5v13L7.5 14.5H4z" />
            <path d="M15.5 9a4 4 0 0 1 0 6" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" />
          </svg>
          <input class="volume__input" type="range" data-el="volume" min="0" max="1" step="0.01" value="0.8" aria-label="音量" />
          <!-- 数字はダブルクリック（またはフォーカスして Enter）で直接入力に変わる -->
          <span
            class="volume__value"
            data-el="volume-value"
            role="button"
            tabindex="0"
            data-tip="ダブルクリックで数値を入力"
            >80</span
          >
          <input
            class="volume__entry"
            type="text"
            inputmode="numeric"
            data-el="volume-entry"
            aria-label="音量（0〜100）"
            hidden
          />
        </div>

        <span class="topbar__spacer"></span>

        <div class="topbar__actions">
          <button class="button" type="button" data-el="add-tracks">音源を追加</button>

          <button
            class="iconbutton"
            type="button"
            data-el="open-mini"
            data-tip="ミニプレイヤーに切り替え"
            aria-label="ミニプレイヤーに切り替え"
          >
            <svg class="icon" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
              <path d="M4 5h16a1 1 0 0 1 1 1v12a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1m1 2v10h14V7z" />
              <rect x="12" y="12" width="6" height="4" rx="1" />
            </svg>
          </button>

          <button
            class="iconbutton"
            type="button"
            data-el="open-folder"
            data-tip="保存フォルダを開く"
            aria-label="保存フォルダを開く"
          >
            <svg class="icon" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
              <path d="M3 6.5A1.5 1.5 0 0 1 4.5 5h4l2 2h9A1.5 1.5 0 0 1 21 8.5v9a1.5 1.5 0 0 1-1.5 1.5h-15A1.5 1.5 0 0 1 3 17.5z" />
            </svg>
          </button>

          <button
            class="iconbutton"
            type="button"
            data-el="change-library"
            data-tip="ライブラリの保存先を変更"
            aria-label="ライブラリの保存先を変更"
          >
            <svg class="icon" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
              <path d="M3 6.5A1.5 1.5 0 0 1 4.5 5h4l2 2h9A1.5 1.5 0 0 1 21 8.5V11h-2V9h-8.8l-2-2H5v10h6v2H4.5A1.5 1.5 0 0 1 3 17.5z" />
              <path d="M17 13.5 22 17l-5 3.5V18h-4v-2h4z" />
            </svg>
          </button>

          <button
            class="iconbutton"
            type="button"
            data-el="theme-toggle"
            data-tip="ナイトモード切替"
            aria-label="ナイトモード切替"
            aria-pressed="false"
          >
            <svg class="icon icon--moon" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
              <path d="M20 14.5A8.5 8.5 0 0 1 9.5 4a8.5 8.5 0 1 0 10.5 10.5" />
            </svg>
            <svg class="icon icon--sun" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
              <path d="M12 7a5 5 0 1 0 0 10 5 5 0 0 0 0-10m0-5 1.5 3h-3zm0 20-1.5-3h3zM2 12l3-1.5v3zm20 0-3 1.5v-3zM5 5l3.2 1-2.2 2.2zm14 14-3.2-1 2.2-2.2zM19 5l-1 3.2-2.2-2.2zM5 19l1-3.2 2.2 2.2z" />
            </svg>
          </button>

          <button
            class="trashcan"
            type="button"
            data-el="trash"
            data-dropping="false"
            data-tip="曲をここにドラッグすると音源とジャケットを削除します"
            aria-label="ゴミ箱"
          >
            <svg class="icon" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
              <path d="M9 3h6l1 2h4v2H4V5h4zM6 8h12l-1 12.2A2 2 0 0 1 15 22H9a2 2 0 0 1-2-1.8zm3.5 2.5v9h1.5v-9zm3.5 0v9h1.5v-9z" />
            </svg>
          </button>
        </div>
      </header>

      <main class="stage">
        <section class="cover">
          <!--
            いま鳴らしている単位（アルバム / プレイリスト）の札。
            下のジャケットは「その曲」のもの、この札は「その入れ物」のもの。
            アルバムの中に単独配信のジャケットを持つ曲が混ざっていても、
            どのアルバムを聴いているのか分かるようにするための表示。
            この札に画像を落とすと、入れ物側のジャケットが変わる。
          -->
          <div class="cover__album" data-el="cover-album" data-dropping="false" hidden>
            <span class="cover__album-art" data-el="cover-album-art" data-empty="true">
              <img class="cover__album-image" data-el="cover-album-image" alt="" />
            </span>
            <span class="cover__album-text">
              <span class="cover__album-name" data-el="cover-album-name"></span>
              <span class="cover__album-sub" data-el="cover-album-sub"></span>
            </span>
          </div>

          <div class="cover__frame" data-el="cover-frame" data-empty="true" data-dropping="false">
            <img class="cover__image" data-el="cover-image" alt="" />
            <!-- 曲を選んでいないときの目印。連桁でつないだ 2 つの音符（♬） -->
            <div class="cover__placeholder" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="currentColor">
                <!-- 桁 -->
                <path d="M9 4.4 20 2.4V5L9 7z" />
                <path d="M9 7.6 20 5.6v2.6L9 10.2z" />
                <!-- 符幹 -->
                <rect x="8" y="4.4" width="1.8" height="12.8" rx=".9" />
                <rect x="18.2" y="2.4" width="1.8" height="11.8" rx=".9" />
                <!-- 符頭 -->
                <ellipse cx="6.4" cy="17.6" rx="3.2" ry="2.5" transform="rotate(-18 6.4 17.6)" />
                <ellipse cx="16.6" cy="14.6" rx="3.2" ry="2.5" transform="rotate(-18 16.6 14.6)" />
              </svg>
            </div>
            <p class="cover__hint">クリックまたは画像をドロップで、この曲のジャケットを設定</p>
          </div>
        </section>

        <section class="nowplaying">
          <!-- 棚を展開したときは、この塊がそのまま 1 行に畳まれる -->
          <div class="nowplaying__meta">
            <h2 class="nowplaying__title" data-el="np-title">曲を選んでください</h2>
            <p class="nowplaying__artist" data-el="np-artist">—</p>
            <p class="nowplaying__format" data-el="np-format" hidden></p>
          </div>

          <div class="seekbar">
            <input
              class="seekbar__input"
              type="range"
              data-el="seek"
              min="0"
              max="1"
              step="0.0001"
              value="0"
              aria-label="再生位置"
              disabled
            />
            <div class="seekbar__times">
              <span class="seekbar__time seekbar__time--current" data-el="current-time">0:00</span>
              <span class="seekbar__time" data-el="duration">0:00</span>
            </div>
          </div>

          <div class="transport">
            <button class="transport__button" type="button" data-el="prev" data-tip="前の曲" aria-label="前の曲" disabled>
              <svg class="icon" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
                <path d="M7 6h2v12H7zm11 0v12l-8-6z" />
              </svg>
            </button>

            <button
              class="transport__button transport__button--play"
              type="button"
              data-el="play-toggle"
              data-playing="false"
              aria-label="再生"
              disabled
            >
              <svg class="icon icon--play" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
                <path d="M8 5.5v13l11-6.5z" />
              </svg>
              <svg class="icon icon--pause" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
                <path d="M8 5h3v14H8zm5 0h3v14h-3z" />
              </svg>
            </button>

            <button class="transport__button" type="button" data-el="stop" data-tip="停止" aria-label="停止" disabled>
              <svg class="icon" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
                <rect x="7" y="7" width="10" height="10" rx="1.5" />
              </svg>
            </button>

            <button class="transport__button" type="button" data-el="next" data-tip="次の曲" aria-label="次の曲" disabled>
              <svg class="icon" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
                <path d="M15 6h2v12h-2zM6 6l8 6-8 6z" />
              </svg>
            </button>

            <!--
              ループ。押すたびに しない -> 全曲 -> 1曲 と切り替わる。
              アルバム・プレイリスト・再生キューのどれを鳴らしていても同じように効く。
            -->
            <button
              class="transport__button transport__button--repeat"
              type="button"
              data-el="repeat"
              data-repeat="off"
              data-tip="ループしない"
              aria-label="ループしない"
            >
              <svg
                class="icon icon--repeat"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="1.8"
                stroke-linecap="round"
                stroke-linejoin="round"
                aria-hidden="true"
              >
                <path d="M5 11V9a3 3 0 0 1 3-3h11" />
                <path d="m16 3 3 3-3 3" />
                <path d="M19 13v2a3 3 0 0 1-3 3H5" />
                <path d="m8 15-3 3 3 3" />
              </svg>
              <svg
                class="icon icon--repeat-one"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="1.8"
                stroke-linecap="round"
                stroke-linejoin="round"
                aria-hidden="true"
              >
                <path d="M5 11V9a3 3 0 0 1 3-3h11" />
                <path d="m16 3 3 3-3 3" />
                <path d="M19 13v2a3 3 0 0 1-3 3H5" />
                <path d="m8 15-3 3 3 3" />
                <path d="M11 10.5 12.6 9.6V15" stroke-width="2" />
              </svg>
            </button>

            <!-- シャッフル。並びはそのままで、次に鳴らす曲だけを散らす -->
            <button
              class="transport__button transport__button--shuffle"
              type="button"
              data-el="shuffle"
              data-shuffle="false"
              data-tip="順番どおりに再生"
              aria-label="順番どおりに再生"
            >
              <svg
                class="icon"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="1.8"
                stroke-linecap="round"
                stroke-linejoin="round"
                aria-hidden="true"
              >
                <path d="M4 7h3.5l9 10H20" />
                <path d="m17 4 3 3-3 3" />
                <path d="M4 17h3.5l2.6-2.9" />
                <path d="M13.9 9.9 16.5 7H20" />
                <path d="m17 14 3 3-3 3" />
              </svg>
            </button>
          </div>
        </section>

        <!--
          アルバム / プレイリストを再生しているときと、
          棚のカードを掴んでいる間（再生キューの受け皿）に出る。
        -->
        <aside class="tracklist" data-el="list-panel" data-dropping="false">
          <header class="tracklist__head">
            <h3 class="tracklist__title" data-el="list-title">リスト</h3>
            <span class="tracklist__count" data-el="list-count">0曲</span>
            <!-- 再生キューを鳴らしているときだけ出る -->
            <button
              class="tracklist__edit tracklist__edit--danger"
              type="button"
              data-el="list-clear"
              data-tip="再生キューを空にする"
              hidden
            >
              空にする
            </button>
            <button
              class="tracklist__edit"
              type="button"
              data-el="list-edit"
              data-active="false"
              data-tip="タイトル・アーティスト・アルバムを直接編集する"
            >
              編集
            </button>
          </header>
          <ol class="tracklist__items" data-el="list"></ol>
          <p class="tracklist__empty" data-el="list-empty" hidden></p>
        </aside>
      </main>

      <footer class="shelf" data-view="grid" data-source="collections" data-expanded="false">
        <div class="shelf__toolbar">
          <label class="search">
            <svg class="search__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
              <circle cx="10.5" cy="10.5" r="6.5" />
              <path d="m15.5 15.5 4 4" stroke-linecap="round" />
            </svg>
            <input
              class="search__input"
              type="search"
              data-el="shelf-search"
              placeholder="アルバム・曲名・アーティストで検索"
              aria-label="検索"
            />
            <!-- 入力があるときだけ出る。押すと検索を解除する -->
            <button
              class="search__clear"
              type="button"
              data-el="shelf-search-clear"
              data-tip="検索をクリア"
              aria-label="検索をクリア"
              hidden
            >
              <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
                <path d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20m3.5 12.1-1.4 1.4L12 13.4l-2.1 2.1-1.4-1.4L10.6 12 8.5 9.9l1.4-1.4L12 10.6l2.1-2.1 1.4 1.4L13.4 12z" />
              </svg>
            </button>
          </label>

          <!-- 棚に並べるものの単位。曲単位にすると 1 曲ずつキューへ運べる -->
          <div class="viewswitch" role="group" aria-label="並べる単位の切り替え">
            <button
              class="viewswitch__button"
              type="button"
              data-el="shelf-src-collections"
              data-active="true"
              data-tip="アルバム・プレイリスト単位で並べる"
            >
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                <circle cx="15.5" cy="12" r="6" opacity=".5" />
                <circle cx="9" cy="12" r="6.5" />
                <circle cx="9" cy="12" r="1.8" fill="currentColor" stroke="none" />
              </svg>
            </button>
            <button
              class="viewswitch__button"
              type="button"
              data-el="shelf-src-tracks"
              data-active="false"
              data-tip="曲単位で並べる"
            >
              <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
                <path d="M10 5.5 20 3.6v2.5L10 8z" />
                <rect x="9" y="5.5" width="1.7" height="11.5" rx=".85" />
                <rect x="18.3" y="3.6" width="1.7" height="10.5" rx=".85" />
                <ellipse cx="7.5" cy="17.4" rx="3" ry="2.4" transform="rotate(-18 7.5 17.4)" />
                <ellipse cx="16.8" cy="14.5" rx="3" ry="2.4" transform="rotate(-18 16.8 14.5)" />
              </svg>
            </button>
          </div>

          <div class="viewswitch" role="group" aria-label="表示の切り替え">
            <button class="viewswitch__button" type="button" data-el="shelf-view-grid" data-active="true" data-tip="グリッド表示">
              <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
                <rect x="3" y="3" width="7.5" height="7.5" rx="1.5" />
                <rect x="13.5" y="3" width="7.5" height="7.5" rx="1.5" />
                <rect x="3" y="13.5" width="7.5" height="7.5" rx="1.5" />
                <rect x="13.5" y="13.5" width="7.5" height="7.5" rx="1.5" />
              </svg>
            </button>
            <button class="viewswitch__button" type="button" data-el="shelf-view-list" data-active="false" data-tip="リスト表示">
              <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
                <rect x="3" y="4" width="4" height="4" rx="1" />
                <rect x="9" y="5" width="12" height="2" rx="1" />
                <rect x="3" y="10" width="4" height="4" rx="1" />
                <rect x="9" y="11" width="12" height="2" rx="1" />
                <rect x="3" y="16" width="4" height="4" rx="1" />
                <rect x="9" y="17" width="12" height="2" rx="1" />
              </svg>
            </button>
          </div>

          <button class="button button--small" type="button" data-el="shelf-expand">
            <span data-el="shelf-expand-label">もっと見る</span>
          </button>

          <button class="button button--small" type="button" data-el="shelf-add">＋ プレイリスト</button>
        </div>

        <!-- 選択中だけ出る -->
        <div class="selectionbar" data-el="shelf-selection" hidden>
          <span class="selectionbar__count" data-el="shelf-selection-count">0件を選択中</span>
          <button class="button button--small" type="button" data-el="shelf-make-album">
            アルバムにまとめる
          </button>
          <button class="button button--small" type="button" data-el="shelf-make-playlist">
            プレイリストにする
          </button>
          <button class="button button--small button--danger" type="button" data-el="shelf-delete-selection">
            削除
          </button>
          <button class="button button--small button--quiet" type="button" data-el="shelf-clear-selection">
            選択を解除
          </button>
        </div>

        <!-- 空きスペースをドラッグすると矩形選択になる -->
        <div class="shelf__body" data-el="shelf-body">
          <div class="shelf__list" data-el="shelf-list"></div>
          <p class="shelf__empty" data-el="shelf-empty">
            音源ファイルをウィンドウにドラッグすると取り込めます
          </p>
          <div class="marquee-select" data-el="shelf-marquee" hidden></div>
        </div>
      </footer>

      <!-- ブランドマークを押すと出る。バージョンと更新の確認だけ -->
      <div class="about" data-el="about" role="dialog" aria-label="バージョン情報" hidden>
        <div class="about__head">
          <svg class="about__mark" viewBox="0 0 100 108.67" aria-hidden="true">
            <path
              fill="currentColor"
              fill-rule="evenodd"
              d="M0 50 L0 105.6 C0 107.5 1.3 108.7 3.1 108.7 C3.9 108.7 4.6 108.4 5.2 108 C7.5 103.5 14 98.5 25.5 93.6 A50 50 0 1 0 0 50 Z M23.5 58 A34.3 34.3 0 1 1 92.1 58 A34.3 34.3 0 1 1 23.5 58 Z"
            />
          </svg>
          <div>
            <p class="about__name">P-on</p>
            <p class="about__version">バージョン <span data-el="about-version">—</span></p>
          </div>
        </div>

        <p class="about__status" data-el="about-status" data-tone="info"></p>

        <div class="about__actions">
          <button class="button button--small" type="button" data-el="about-check">更新を確認</button>
        </div>
      </div>

      <!-- カードを右クリックしたときのメニュー（収録曲の一覧もここに入る） -->
      <div class="menu" data-el="shelf-menu" hidden></div>

      <div class="dropveil" data-el="dropveil" hidden>
        <div class="dropveil__inner">
          <p class="dropveil__title">ドロップして取り込む</p>
          <p class="dropveil__note">mp3 / wav / flac などをライブラリに保存して再生キューに追加します</p>
        </div>
      </div>

      <p class="toast" data-el="status" data-tone="info" hidden></p>

      <!-- 楽曲情報の編集 -->
      <dialog class="dialog" data-el="editor">
        <form class="dialog__form" data-el="editor-form">
          <h3 class="dialog__heading">楽曲情報</h3>

          <div class="dialog__body">
            <div class="editor__cover">
              <div class="editor__thumb" data-el="editor-thumb" data-empty="true" data-dropping="false">
                <img class="editor__thumb-image" data-el="editor-thumb-image" alt="" />
                <span class="editor__thumb-hint">画像をドロップ</span>
              </div>
              <button class="button button--small" type="button" data-el="editor-pick-cover">
                この曲のジャケット
              </button>
              <button class="button button--small button--quiet" type="button" data-el="editor-clear-cover">
                外す
              </button>
              <p class="editor__note" data-el="editor-cover-note"></p>
            </div>

            <div class="editor__fields">
              <label class="field">
                <span class="field__label">タイトル</span>
                <input class="field__input" type="text" data-el="editor-title" required />
              </label>
              <label class="field">
                <span class="field__label">アーティスト</span>
                <input class="field__input" type="text" data-el="editor-artist" placeholder="未設定" />
              </label>
              <label class="field">
                <span class="field__label">アルバム</span>
                <input
                  class="field__input"
                  type="text"
                  data-el="editor-album"
                  placeholder="未設定のときはシングルとして扱われます"
                />
              </label>
            </div>
          </div>

          <footer class="dialog__actions">
            <button class="button button--quiet" type="button" data-el="editor-cancel">キャンセル</button>
            <button class="button button--primary" type="submit">保存</button>
          </footer>
        </form>
      </dialog>

      <!-- プレイリスト名の入力 -->
      <dialog class="dialog dialog--compact" data-el="name-dialog">
        <form class="dialog__form" data-el="name-form">
          <h3 class="dialog__heading" data-el="name-heading">プレイリスト名</h3>
          <label class="field">
            <span class="field__label">名前</span>
            <input class="field__input" type="text" data-el="name-input" />
            <span class="field__note" data-el="name-note"></span>
          </label>
          <footer class="dialog__actions">
            <button class="button button--quiet" type="button" data-el="name-cancel">キャンセル</button>
            <button class="button button--primary" type="submit" data-el="name-submit">決定</button>
          </footer>
        </form>
      </dialog>
    </div>

    <script type="module" src="./src/main.js"></script>
  </body>
</html>
