<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: hamon-media:; media-src 'self' hamon-media: blob:; font-src 'self'; connect-src 'self' ws:"
    />
    <title>HAMON</title>
  </head>
  <body>
    <!--
      JS が参照するのは data-el 属性だけ。
      class は見た目のためだけに使っているので、自由に付け替えて構わない。
    -->
    <div class="app" id="app" data-state="idle">
      <header class="app__header">
        <h1 class="app__brand">HAMON</h1>
        <button class="button button--ghost" type="button" data-el="open">ファイルを開く</button>
      </header>

      <main class="player">
        <section class="artwork" data-el="artwork" data-empty="true" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
            <path d="M9 18V5l10-2v13" stroke-linecap="round" stroke-linejoin="round" />
            <circle cx="6.5" cy="18" r="2.5" />
            <circle cx="16.5" cy="16" r="2.5" />
          </svg>
        </section>

        <section class="track-info">
          <p class="track-info__title" data-el="title">ファイルが選択されていません</p>
          <p class="track-info__subtitle" data-el="subtitle">
            「ファイルを開く」から mp3 / wav / flac を選択
          </p>
        </section>

        <section class="seekbar">
          <input
            class="seekbar__input"
            type="range"
            data-el="seek"
            min="0"
            max="1"
            step="0.0001"
            value="0"
            aria-label="再生位置"
            disabled
          />
          <div class="seekbar__times">
            <span class="seekbar__time seekbar__time--current" data-el="current-time">0:00</span>
            <span class="seekbar__time seekbar__time--total" data-el="duration">0:00</span>
          </div>
        </section>

        <section class="transport">
          <button
            class="transport__button transport__button--play"
            type="button"
            data-el="play-toggle"
            data-playing="false"
            aria-label="再生"
            disabled
          >
            <svg class="icon icon--play" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
              <path d="M8 5.5v13l11-6.5z" />
            </svg>
            <svg class="icon icon--pause" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
              <path d="M8 5h3v14H8zm5 0h3v14h-3z" />
            </svg>
          </button>

          <button
            class="transport__button transport__button--stop"
            type="button"
            data-el="stop"
            aria-label="停止"
            title="停止"
            disabled
          >
            <svg class="icon" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
              <rect x="7" y="7" width="10" height="10" rx="1.5" />
            </svg>
          </button>
        </section>

        <section class="volume">
          <svg class="volume__icon" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
            <path d="M4 9.5h3.5L12 5.5v13L7.5 14.5H4z" />
            <path
              d="M15.5 9a4 4 0 0 1 0 6"
              fill="none"
              stroke="currentColor"
              stroke-width="1.6"
              stroke-linecap="round"
            />
          </svg>
          <input
            class="volume__input"
            type="range"
            data-el="volume"
            min="0"
            max="1"
            step="0.01"
            value="0.8"
            aria-label="音量"
          />
          <span class="volume__value" data-el="volume-value">80</span>
        </section>
      </main>

      <footer class="app__status" data-el="status" data-tone="info" role="status"></footer>
    </div>

    <script type="module" src="./src/main.js"></script>
  </body>
</html>
